apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-api
  template:
    metadata:
      labels:
        app: user-api
    spec:
      containers:
        - name: user-api
          image: princesharma25/fundoo-user:live
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: ConnectionStrings__DefaultConnection
              value: "Host=postgres-service;Port=5432;Database=FundooUserDb;Username=postgres;Password=FundooNotes@2026"
            - name: Jwt__Key
              value: "FundooUserApi_Dev_Secret_Key_2026_AtLeast32Bytes!"
            - name: Jwt__Issuer
              value: "FundooUserApi"
            - name: Jwt__Audience
              value: "FundooClient"
            - name: Jwt__ExpiryMinutes
              value: "60"
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  selector:
    app: user-api
  ports:
    - port: 80
      targetPort: 8080
